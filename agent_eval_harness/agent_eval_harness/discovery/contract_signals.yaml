# Keyword-tier signal for retrieval-agent detection (Stage 3 harvest): an ADDITIVE fast-path for constructor-dep string matches (e.g. RetrievalService), combined with the authoritative role=='retrieval_agent' tier via OR — needed because some retrieval agents (e.g. linear_rag's RetrieverComponent) have no matching dep and would be missed by the keyword tier alone.
keywords:
  - RetrievalService

# OPTIONAL per-target override for virtual-input dep-role classification; detection is structural/framework-agnostic by default (see discovery/enrichment.py) — add a class name here only to force-classify a dep whose evidence type doesn't resolve to a structured schema.
dep_role_keywords:
  retrieval: []
  llm_provider: []
  storage: []
