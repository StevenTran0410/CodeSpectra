target_system_id: multi_agent
discrepancies: []
components:
  - id: guard_rule
    role: input_guard.rule
    model: null
    entry_point: "test_targets.multi_agent.components:GuardComponent"
    span_match:
      - component_name: guard
        tags: { aeh.check.kind: rule }
    constraints:
      - name: rejects_too_short
        value: 5
        source: "test_targets/multi_agent/components.py:GuardComponent.MIN_QUERY_LENGTH"
    upstream: []
    downstream: [guard_llm]

  - id: guard_llm
    role: input_guard.llm
    model: fake-nano
    entry_point: "test_targets.multi_agent.components:GuardComponent"
    span_match:
      - component_name: guard
        tags: { aeh.check.kind: llm }
    constraints: []
    upstream: [guard_rule]
    downstream: [planner]

  - id: planner
    role: orchestrator
    model: fake-frontier
    entry_point: "test_targets.multi_agent.components:PlannerComponent"
    span_match:
      - component_name: planner
    constraints:
      - name: max_items_per_call
        value: 2
        source: "test_targets/multi_agent/components.py:PlannerComponent.MAX_ITEMS_PER_CALL"
    upstream: [guard_llm]
    downstream: [worker]

  - id: worker
    role: retrieval_agent
    model: fake-strong
    entry_point: "test_targets.multi_agent.components:WorkerComponent"
    span_match:
      # span_name_pattern (not component_name) — worker's nested tool_call spans
      # also carry component_name="worker" as descriptive metadata, so matching
      # on component_name alone would ambiguously also catch them.
      - span_name_pattern: "^aeh\\.worker_step$"
    constraints:
      - name: max_retries
        value: 1
        source: "test_targets/multi_agent/components.py:PlannerComponent.run_async"
    upstream: [planner]
    downstream: [judge]

  - id: case_law_search_tool
    role: tool
    model: null
    entry_point: "test_targets.multi_agent.tools:case_law_search"
    span_match:
      - tags: { aeh.tool.name: case_law_search }
    constraints: []
    upstream: [worker]
    downstream: []

  - id: decoy_tool
    role: tool
    model: null
    entry_point: "test_targets.multi_agent.tools:decoy_lookup"
    span_match:
      - tags: { aeh.tool.name: decoy_lookup }
    constraints: []
    upstream: [worker]
    downstream: []

  - id: judge
    role: validator
    model: fake-strong
    entry_point: "test_targets.multi_agent.components:JudgeComponent"
    span_match:
      - component_name: judge
    constraints: []
    upstream: [worker]
    downstream: [writer, planner]

  - id: writer
    role: writer
    model: fake-mini
    entry_point: "test_targets.linear_rag.components:WriterComponent"
    span_match:
      - component_name: writer
    constraints: []
    upstream: [judge]
    downstream: []
